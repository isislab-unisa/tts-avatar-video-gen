services:
  mongo:
    image: mongo:7
    container_name: dubme-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    container_name: dubme-minio
    command: server /data --console-address ":9090"
    # carico credenziali anche da backend/.env per comodità
    env_file:
      - backend/.env
    environment:
      # credenziali di root (se non presenti in .env uso valori di default)
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # MinIO API
      - "9090:9090" # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio

  createbuckets:
    image: minio/mc:latest
    container_name: dubme-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - backend/.env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $MINIO_ACCESS_KEY $MINIO_SECRET_KEY &&
        mc mb -p local/$MINIO_BUCKET || true &&
        mc anonymous set download local/$MINIO_BUCKET || true &&
        exit 0
      "
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubme-backend
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    env_file:
      - backend/.env
    environment:
      # override per l'ambiente docker (comunicazione interna fra container)
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      # URL PUBBLICO che il backend userà nei presigned link (browser)
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
        MONGODB_URI: mongodb://mongo:27017/dubme
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-build-time-secret-123}
        BACKEND_API_URL: http://backend:4000
        API_JWT_SECRET: ${API_JWT_SECRET:-supersecret123}
        BETTER_AUTH_URL: http://frontend:3000
    container_name: dubme-frontend
    depends_on:
      backend:
        condition: service_started
    env_file:
      - frontend/.env
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:4000
      MONGODB_URI: mongodb://mongo:27017/dubme
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mongo-data:
  minio-data:
  minio-config:
