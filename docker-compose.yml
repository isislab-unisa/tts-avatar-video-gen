services:
  mongo:
    image: mongo:7
    container_name: dubme-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mongo-data:/data/db
    networks:
      - dubme-network

  minio:
    image: minio/minio:latest
    container_name: dubme-minio
    command: server /data --console-address ":9090"
    # carico credenziali dal .env della root
    env_file:
      - ./.env
    environment:
      # credenziali di root (forzo l'uso delle variabili)
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # MinIO API
      - "9090:9090" # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    networks:
      - dubme-network

  createbuckets:
    image: minio/mc:latest
    container_name: dubme-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./.env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
        mc mb -p local/$MINIO_BUCKET || true &&
        mc anonymous set download local/$MINIO_BUCKET || true &&
        exit 0
      "
    restart: "no"
    networks:
      - dubme-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubme-backend
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    env_file:
      - ./.env
    environment:
      # Override per l'ambiente docker (comunicazione interna fra container)
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      # URL PUBBLICO che il backend userà nei presigned link (browser)
      MINIO_PUBLIC_URL: http://localhost:9000
      # Variabili MinIO per il backend
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - dubme-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public URLs (per il browser)
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
        # Internal URLs (per comunicazione tra container)
        MONGODB_URI: mongodb://mongo:27017/dubme
        BACKEND_API_URL: http://backend:4000
        # Better Auth
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-key-for-development-12345}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
        # API JWT
        API_JWT_SECRET: ${API_JWT_SECRET:-supersecret123}
        # OAuth Credentials
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
        # Email
        GMAIL_USER: ${GMAIL_USER:-}
        GMAIL_PASS: ${GMAIL_PASS:-}
        # Email verification
        EMAIL_VERIFICATION_CALLBACK_URL: ${EMAIL_VERIFICATION_CALLBACK_URL:-http://localhost:3000/email-verified}
    container_name: dubme-frontend
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      # Override della porta per il frontend
      PORT: 3000
      # Backend API (interno per comunicazione tra container)
      BACKEND_API_URL: http://backend:4000
      # MongoDB (interno per comunicazione tra container)
      MONGODB_URI: mongodb://mongo:27017/dubme
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - dubme-network

volumes:
  mongo-data:
  minio-data:
  minio-config:

networks:
  dubme-network:
    driver: bridge
